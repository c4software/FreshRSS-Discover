# Surcharges du profil Detekt par défaut (`buildUponDefaultConfig = true`).
# On ne redéclare ici que ce qui diverge réellement du défaut.

build:
  maxIssues: 0

complexity:
  LongParameterList:
    # Les @Composable acceptent naturellement beaucoup de paramètres (état + callbacks).
    functionThreshold: 8
    constructorThreshold: 8
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable']
    # Un ViewModel d'écran est un **collecteur de gestes** : son nombre de
    # méthodes suit celui des commandes que l'écran offre — recharger, ouvrir,
    # partager, acquitter deux avis — et non sa complexité, qui tient dans des
    # méthodes de quelques lignes. Le seuil par défaut de 11 a été atteint en
    # GOAL-025 par une garde de quatre lignes ; le franchir en découpant le
    # ViewModel en deux ferait deux moitiés d'un même état pour satisfaire un
    # compteur. Douze, et pas plus : au-delà, la question redeviendra légitime.
    thresholdInClasses: 12
    # Un DAO Room est une **liste de requêtes** : chacune est une ligne de SQL,
    # et deux d'entre elles existent séparément parce que `NOT IN ()` n'est pas
    # du SQL valide (GOAL-027), pas parce qu'on aurait mal découpé. Le scinder
    # en deux interfaces obligerait à répartir des requêtes qui portent sur la
    # même table.
    #
    # Le seuil est la valeur **à laquelle** Detekt signale, pas celle qu'il
    # tolère. La question s'est rouverte en GOAL-037 avec la treizième requête
    # — lire des articles par identifiants pour le récap — et la réponse reste
    # la même : une requête d'une ligne sur la même table. Treize passent, la
    # quatorzième rouvrira la question.
    thresholdInInterfaces: 14

naming:
  FunctionNaming:
    # Les @Composable suivent la convention PascalCase.
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    # Une valeur nommée (jeton de couleur, seuil, durée) est déjà la forme
    # recommandée : la signaler à nouveau n'apporte rien.
    ignorePropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
  MaxLineLength:
    maxLineLength: 120
  UnusedPrivateMember:
    # Les @Preview ne sont appelées que par l'outillage Android Studio.
    ignoreAnnotated: ['Preview']
